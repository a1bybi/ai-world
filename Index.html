<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AI World — Autonomous Artificial Society</title>
  <style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --border: #2d3a4f;
  --text: #e7ecf3;
  --muted: #8b9bb4;
  --accent: #4fc3f7;
  --accent-dim: #2896c4;
  --success: #66bb6a;
  --warning: #ffa726;
  --danger: #ef5350;
  --house: #a1887f;
  --forest: #43a047;
  --river: #29b6f6;
  --agent: #ffee58;
  --resource: #ff7043;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 1400px;
  margin: 0 auto;
}

/* Header */
.header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.header h1 {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.time-display {
  font-size: 0.9rem;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.weather-display {
  font-size: 0.85rem;
  color: var(--muted);
}

.header-controls {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

/* Buttons */
.btn {
  background: var(--border);
  color: var(--text);
  border: none;
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  background: #3a4a63;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn.primary {
  background: var(--accent-dim);
  color: #fff;
}

.btn.primary:hover:not(:disabled) {
  background: var(--accent);
}

.btn.danger {
  background: #5c2a2a;
}

.btn.danger:hover:not(:disabled) {
  background: var(--danger);
}

.btn.small {
  padding: 4px 8px;
  font-size: 0.75rem;
}

.speed-select {
  background: var(--border);
  color: var(--text);
  border: none;
  border-radius: 6px;
  padding: 7px 8px;
  font-size: 0.85rem;
}

/* Main layout */
.main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.world-panel {
  grid-row: 1 / 3;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-header h2 {
  font-size: 0.95rem;
  font-weight: 500;
}

.world-stats {
  display: flex;
  gap: 12px;
  font-size: 0.8rem;
  color: var(--muted);
}

/* Map */
.map-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  min-height: 0;
  overflow: hidden;
}

#world-canvas {
  max-width: 100%;
  max-height: 100%;
  border-radius: 4px;
  background: #0a0e14;
  image-rendering: pixelated;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 6px 12px;
  font-size: 0.75rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}

.dot.house { background: var(--house); }
.dot.forest { background: var(--forest); }
.dot.river { background: var(--river); }
.dot.agent { background: var(--agent); border-radius: 50%; }
.dot.resource { background: var(--resource); }

/* Event log */
.event-log {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 0.8rem;
  line-height: 1.45;
  -webkit-overflow-scrolling: touch;
}

.event-entry {
  padding: 4px 0;
  border-bottom: 1px solid rgba(45, 58, 79, 0.5);
}

.event-time {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-right: 6px;
}

.event-text {
  color: var(--text);
}

.event-entry.important .event-text {
  color: var(--accent);
}

/* Agent list / detail */
.agent-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  -webkit-overflow-scrolling: touch;
}

.agent-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}

.agent-card:hover {
  border-color: var(--accent-dim);
  background: rgba(79, 195, 247, 0.06);
}

.agent-card-name {
  font-weight: 600;
  font-size: 0.95rem;
  margin-bottom: 2px;
}

.agent-card-meta {
  font-size: 0.75rem;
  color: var(--muted);
}

.agent-card-status {
  font-size: 0.8rem;
  margin-top: 4px;
  color: var(--accent);
}

.agent-detail {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  -webkit-overflow-scrolling: touch;
}

.agent-detail.hidden {
  display: none;
}

.agent-detail h3 {
  font-size: 1.1rem;
  margin: 8px 0 4px;
}

.agent-detail .section {
  margin-top: 14px;
}

.agent-detail .section-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 4px;
}

.agent-detail .bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 2px;
}

.agent-detail .bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

.bar-fill.energy { background: var(--success); }
.bar-fill.mood { background: var(--warning); }

.rel-item, .mem-item, .pos-item {
  font-size: 0.8rem;
  padding: 3px 0;
  border-bottom: 1px solid rgba(45,58,79,0.4);
}

.rel-positive { color: var(--success); }
.rel-negative { color: var(--danger); }
.rel-neutral { color: var(--muted); }

/* Mobile */
@media (max-width: 800px) {
  .main {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }

  .world-panel {
    grid-row: auto;
    min-height: 280px;
  }

  .header {
    padding: 8px 10px;
  }

  .header h1 {
    font-size: 1rem;
  }

  .btn {
    padding: 6px 9px;
    font-size: 0.8rem;
  }
}

@media (max-width: 480px) {
  .header-controls {
    width: 100%;
  }

  .world-stats {
    font-size: 0.7rem;
    gap: 8px;
  }
}

  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1>AI World</h1>
        <span id="time-display" class="time-display">Day 1 — 06:00</span>
        <span id="weather-display" class="weather-display">Clear</span>
      </div>
      <div class="header-controls">
        <button id="btn-run" class="btn primary">▶ Run</button>
        <button id="btn-pause" class="btn" disabled>■ Pause</button>
        <button id="btn-hour" class="btn">+1 Hour</button>
        <button id="btn-day" class="btn">+1 Day</button>
        <button id="btn-reset" class="btn danger">Reset</button>
        <select id="speed-select" class="speed-select">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="5" selected>5×</option>
          <option value="10">10×</option>
          <option value="30">30×</option>
        </select>
      </div>
    </header>
    <main class="main">
      <section class="panel world-panel">
        <div class="panel-header">
          <h2>World</h2>
          <div class="world-stats">
            <span id="pop-stat">Pop: 5</span>
            <span id="food-stat">Food: 0</span>
            <span id="wood-stat">Wood: 0</span>
          </div>
        </div>
        <div class="map-container">
          <canvas id="world-canvas" width="600" height="400"></canvas>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="dot house"></span> House</span>
          <span class="legend-item"><span class="dot forest"></span> Forest</span>
          <span class="legend-item"><span class="dot river"></span> River</span>
          <span class="legend-item"><span class="dot agent"></span> Agent</span>
          <span class="legend-item"><span class="dot resource"></span> Resource</span>
        </div>
      </section>
      <section class="panel observer-panel">
        <div class="panel-header">
          <h2>Event Log</h2>
          <button id="btn-clear-log" class="btn small">Clear</button>
        </div>
        <div id="event-log" class="event-log"></div>
      </section>
      <section class="panel agent-panel">
        <div class="panel-header">
          <h2>Inhabitant</h2>
        </div>
        <div id="agent-list" class="agent-list"></div>
        <div id="agent-detail" class="agent-detail hidden">
          <button id="btn-close-detail" class="btn small">← Back</button>
          <div id="agent-info"></div>
        </div>
      </section>
    </main>
  </div>
  <script>
/**
 * AI World — World State & Map
 * Pure data + pure functions. No AI logic here.
 */

const TILE = {
  GRASS: 0,
  FOREST: 1,
  RIVER: 2,
  HOUSE: 3,
  PATH: 4,
};

const TILE_COLORS = {
  [TILE.GRASS]: '#1b3a1b',
  [TILE.FOREST]: '#0d4a1f',
  [TILE.RIVER]: '#0a3a5c',
  [TILE.HOUSE]: '#4a3728',
  [TILE.PATH]: '#2a2a20',
};

const MAP_W = 30;
const MAP_H = 20;

/** Create the initial map layout */
function createMap() {
  const map = Array.from({ length: MAP_H }, () =>
    Array.from({ length: MAP_W }, () => TILE.GRASS)
  );

  // River running vertically near the middle-right
  for (let y = 0; y < MAP_H; y++) {
    map[y][20] = TILE.RIVER;
    map[y][21] = TILE.RIVER;
    if (y % 3 === 0) map[y][19] = TILE.RIVER; // slight meander
  }

  // Forest on the left side
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < 7; x++) {
      if (Math.random() > 0.25) map[y][x] = TILE.FOREST;
    }
  }
  // denser forest patch
  for (let y = 3; y < 12; y++) {
    for (let x = 0; x < 5; x++) {
      map[y][x] = TILE.FOREST;
    }
  }

  // Village houses (center-left)
  const housePositions = [
    [10, 8], [12, 7], [11, 10], [14, 9], [13, 11],
  ];
  housePositions.forEach(([x, y]) => {
    map[y][x] = TILE.HOUSE;
  });

  // Simple paths
  for (let x = 8; x < 18; x++) {
    map[9][x] = TILE.PATH;
  }
  for (let y = 6; y < 13; y++) {
    map[y][12] = TILE.PATH;
  }

  return map;
}

/** Resource nodes on the map (gatherable) */
function createResourceNodes() {
  return [
    // Forest wood nodes
    { id: 'wood_1', type: 'wood', x: 2, y: 4, amount: 40 },
    { id: 'wood_2', type: 'wood', x: 4, y: 8, amount: 35 },
    { id: 'wood_3', type: 'wood', x: 1, y: 14, amount: 30 },
    { id: 'wood_4', type: 'wood', x: 5, y: 2, amount: 25 },
    // Food / berry patches near river and grass
    { id: 'food_1', type: 'food', x: 16, y: 5, amount: 20 },
    { id: 'food_2', type: 'food', x: 18, y: 12, amount: 18 },
    { id: 'food_3', type: 'food', x: 15, y: 15, amount: 15 },
    { id: 'food_4', type: 'food', x: 8, y: 3, amount: 12 },
    { id: 'food_5', type: 'food', x: 22, y: 8, amount: 10 }, // across river
  ];
}

/** Buildings (houses) with ownership */
function createBuildings() {
  return [
    { id: 'house_1', type: 'house', x: 10, y: 8, ownerId: null, capacity: 2 },
    { id: 'house_2', type: 'house', x: 12, y: 7, ownerId: null, capacity: 2 },
    { id: 'house_3', type: 'house', x: 11, y: 10, ownerId: null, capacity: 2 },
    { id: 'house_4', type: 'house', x: 14, y: 9, ownerId: null, capacity: 2 },
    { id: 'house_5', type: 'house', x: 13, y: 11, ownerId: null, capacity: 2 },
  ];
}

/** Initial global resources (village stockpile – shared, not owned) */
function createGlobalResources() {
  return {
    food: 25,   // starting communal food
    wood: 15,
    money: 50,  // abstract currency floating in the village
  };
}

/** Create a fresh world state */
function createWorld() {
  return {
    version: 1,
    day: 1,
    hour: 6,          // 0–23
    minute: 0,
    weather: 'clear', // clear | cloudy | rain
    map: createMap(),
    resources: createResourceNodes(),
    buildings: createBuildings(),
    global: createGlobalResources(),
    agents: [],       // filled by agents.js
    events: [],       // chronological log
    tick: 0,          // absolute simulation ticks
  };
}

/** Format time for display */
function formatTime(world) {
  const h = String(world.hour).padStart(2, '0');
  const m = String(world.minute).padStart(2, '0');
  return `Day ${world.day} — ${h}:${m}`;
}

/** Advance time by N minutes */
function advanceTime(world, minutes) {
  world.minute += minutes;
  while (world.minute >= 60) {
    world.minute -= 60;
    world.hour += 1;
  }
  while (world.hour >= 24) {
    world.hour -= 24;
    world.day += 1;
    // simple weather change each day
    const roll = Math.random();
    if (roll < 0.55) world.weather = 'clear';
    else if (roll < 0.85) world.weather = 'cloudy';
    else world.weather = 'rain';
  }
  world.tick += minutes;
}

/** Is it night? (affects energy drain slightly) */
function isNight(world) {
  return world.hour < 6 || world.hour >= 20;
}

/** Distance between two points (Manhattan for simplicity) */
function dist(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}

/** Get tile at coordinates (safe) */
function getTile(world, x, y) {
  if (y < 0 || y >= MAP_H || x < 0 || x >= MAP_W) return null;
  return world.map[y][x];
}

/** Find nearest resource node of a type that still has amount > 0 */
function findNearestResource(world, agent, type) {
  let best = null;
  let bestD = Infinity;
  for (const r of world.resources) {
    if (r.type === type && r.amount > 0) {
      const d = dist(agent, r);
      if (d < bestD) {
        bestD = d;
        best = r;
      }
    }
  }
  return best;
}

/** Find nearest house (any) */
function findNearestHouse(world, agent) {
  let best = null;
  let bestD = Infinity;
  for (const b of world.buildings) {
    if (b.type === 'house') {
      const d = dist(agent, b);
      if (d < bestD) {
        bestD = d;
        best = b;
    }
  }
  return best;
}

/** Agents currently at a location (same tile) */
function agentsAt(world, x, y, excludeId = null) {
  return world.agents.filter(a => a.x === x && a.y === y && a.id !== excludeId);
}

/** Log an event */
function logEvent(world, text, important = false, agentIds = []) {
  const entry = {
    id: `e_${world.tick}_${world.events.length}`,
    day: world.day,
    hour: world.hour,
    minute: world.minute,
    text,
    important,
    agentIds,
    tick: world.tick,
  };
  world.events.push(entry);
  // keep log from growing forever in memory
  if (world.events.length > 800) {
    world.events = world.events.slice(-600);
  }
  return entry;
}

/** Total gatherable of a type left on the map */
function totalResourceLeft(world, type) {
  return world.resources
    .filter(r => r.type === type)
    .reduce((s, r) => s + r.amount, 0);
}

/**
 * AI World — Agents
 * Each inhabitant has personality, needs, memory, relationships, possessions.
 * Decision logic is intentionally simple & rule-based for Phase 1 (free, no LLM).
 */

const NAMES = ['Mira', 'Arin', 'Liora', 'Kael', 'Soren'];

const PERSONALITY_TRAITS = [
  'curious', 'cautious', 'generous', 'ambitious', 'solitary',
  'sociable', 'practical', 'dreamy', 'stubborn', 'empathetic',
];

/** Create one agent */
function createAgent(id, name, x, y) {
  // Pick 2–3 random distinct traits
  const shuffled = [...PERSONALITY_TRAITS].sort(() => Math.random() - 0.5);
  const traits = shuffled.slice(0, 2 + Math.floor(Math.random() * 2));

  return {
    id,
    name,
    x,
    y,
    // Needs (0–100)
    energy: 70 + Math.floor(Math.random() * 20), // food/energy
    mood: 50 + Math.floor(Math.random() * 30),
    // Personality
    traits,
    // Memory
    shortTerm: [],          // recent observations (max ~15)
    longTerm: [],           // important events (max ~40)
    // Relationships: { [otherId]: { score: -100..100, lastInteract: tick, notes: [] } }
    relationships: {},
    // Possessions
    inventory: {
      food: Math.floor(Math.random() * 3),
      wood: Math.floor(Math.random() * 2),
    },
    money: 5 + Math.floor(Math.random() * 10),
    // State
    intention: 'explore',   // current high-level goal
    currentAction: null,    // what they are doing this tick
    actionProgress: 0,      // progress toward multi-tick actions
    homeId: null,           // building id if claimed
    // History of important personal events
    history: [],
    // Preferences that emerge
    preferences: {
      likes: [],
      dislikes: [],
    },
  };
}

/** Create the initial 5 inhabitants near the village */
function createInitialAgents() {
  const startPositions = [
    [11, 8],
    [12, 9],
    [10, 9],
    [13, 8],
    [11, 11],
  ];
  return NAMES.map((name, i) => {
    const [x, y] = startPositions[i];
    return createAgent(`agent_${i + 1}`, name, x, y);
  });
}

/** Add a short-term memory */
function addShortMemory(agent, text, tick) {
  agent.shortTerm.unshift({ text, tick });
  if (agent.shortTerm.length > 15) agent.shortTerm.pop();
}

/** Add a long-term (important) memory */
function addLongMemory(agent, text, tick) {
  agent.longTerm.unshift({ text, tick });
  if (agent.longTerm.length > 40) agent.longTerm.pop();
  agent.history.unshift({ text, tick });
  if (agent.history.length > 30) agent.history.pop();
}

/** Update relationship score */
function adjustRelationship(agent, otherId, delta, note, tick) {
  if (!agent.relationships[otherId]) {
    agent.relationships[otherId] = { score: 0, lastInteract: tick, notes: [] };
  }
  const rel = agent.relationships[otherId];
  rel.score = Math.max(-100, Math.min(100, rel.score + delta));
  rel.lastInteract: tick;
  if (note) {
    rel.notes.unshift({ text: note, tick });
    if (rel.notes.length > 8) rel.notes.pop();
  }
}

/** Get relationship score (0 if unknown) */
function getRelScore(agent, otherId) {
  return agent.relationships[otherId]?.score ?? 0;
}

/** Personality helpers */
function hasTrait(agent, trait) {
  return agent.traits.includes(trait);
}

/**
 * Observe surroundings and produce a short observation string.
 * Used for short-term memory and decision context.
 */
function observe(agent, world) {
  const nearby = world.agents.filter(
    a => a.id !== agent.id && dist(agent, a) <= 3
  );
  const tile = getTile(world, agent.x, agent.y);
  const resHere = world.resources.find(r => r.x === agent.x && r.y === agent.y && r.amount > 0);

  let obs = `At (${agent.x},${agent.y}). `;
  if (tile === TILE.FOREST) obs += 'Forest. ';
  else if (tile === TILE.RIVER) obs += 'River. ';
  else if (tile === TILE.HOUSE) obs += 'Near a house. ';
  else if (tile === TILE.PATH) obs += 'On a path. ';

  if (resHere) obs += `${resHere.type} available (${resHere.amount}). `;
  if (nearby.length) {
    obs += `Nearby: ${nearby.map(a => a.name).join(', ')}. `;
  } else {
    obs += 'Alone. ';
  }
  if (isNight(world)) obs += 'It is night. ';
  if (world.weather === 'rain') obs += 'Raining. ';

  return obs.trim();
}

/**
 * Decide next intention + concrete action proposal.
 * Returns { intention, action, target, reason }
 * The simulation engine validates and executes the action.
 */
function decide(agent, world) {
  // 1. Update needs over time (handled in simulation, but we read them here)
  const hungry = agent.energy < 35;
  const veryHungry = agent.energy < 18;
  const tired = agent.energy < 25 && isNight(world);
  const lonely = agent.mood < 40 && hasTrait(agent, 'sociable');
  const restless = agent.mood < 35;

  // 2. Relevant memories (last few short + any long that mention food/wood/people)
  const recentMem = agent.shortTerm.slice(0, 5).map(m => m.text).join(' ');

  // 3. Nearby agents
  const nearby = world.agents.filter(a => a.id !== agent.id && dist(agent, a) <= 2);

  // --- Priority decisions ---

  // Critical: eat if very hungry and have food
  if (veryHungry && agent.inventory.food > 0) {
    return {
      intention: 'survive',
      action: 'eat',
      target: null,
      reason: 'Very hungry, eating own food.',
    };
  }

  // Gather food if hungry and know of food nearby or can search
  if (hungry || veryHungry) {
    const foodNode = findNearestResource(world, agent, 'food');
    if (foodNode && dist(agent, foodNode) <= 8) {
      if (dist(agent, foodNode) === 0) {
        return {
          intention: 'gather_food',
          action: 'gather',
          target: { type: 'resource', id: foodNode.id },
          reason: 'Gathering food here.',
        };
      }
      return {
        intention: 'gather_food',
        action: 'move',
        target: { x: foodNode.x, y: foodNode.y },
        reason: `Moving toward food at (${foodNode.x},${foodNode.y}).`,
      };
    }
    // ask nearby for food if sociable/generous or desperate
    if (nearby.length && (veryHungry || hasTrait(agent, 'sociable'))) {
      const other = nearby[0];
      return {
        intention: 'request_food',
        action: 'talk',
        target: { type: 'agent', id: other.id, topic: 'ask_food' },
        reason: `Asking ${other.name} for food.`,
      };
    }
  }

  // Rest at night or if low energy
  if ((isNight(world) && agent.energy < 60) || tired) {
    const house = agent.homeId
      ? world.buildings.find(b => b.id === agent.homeId)
      : findNearestHouse(world, agent);
    if (house) {
      if (dist(agent, house) === 0) {
        return {
          intention: 'rest',
          action: 'rest',
          target: null,
          reason: 'Resting for the night.',
        };
      }
      return {
        intention: 'rest',
        action: 'move',
        target: { x: house.x, y: house.y },
        reason: 'Heading to a house to rest.',
      };
    }
  }

  // Social: talk if nearby and mood/personality suggests it
  if (nearby.length && (lonely || hasTrait(agent, 'sociable') || Math.random() < 0.25)) {
    const other = nearby[Math.floor(Math.random() * nearby.length)];
    const score = getRelScore(agent, other.id);
    let topic = 'chat';
    if (agent.inventory.food > 2 && hasTrait(agent, 'generous') && Math.random() < 0.4) {
      topic = 'offer_food';
    } else if (agent.inventory.wood > 1 && Math.random() < 0.3) {
      topic = 'offer_wood';
    } else if (score < -20 && Math.random() < 0.3) {
      topic = 'confront';
    }
    return {
      intention: 'socialize',
      action: 'talk',
      target: { type: 'agent', id: other.id, topic },
      reason: `Talking to ${other.name} (${topic}).`,
    };
  }

  // Gather wood if we have little and are practical/ambitious
  if (agent.inventory.wood < 3 && (hasTrait(agent, 'practical') || hasTrait(agent, 'ambitious') || Math.random() < 0.3)) {
    const woodNode = findNearestResource(world, agent, 'wood');
    if (woodNode && dist(agent, woodNode) <= 10) {
      if (dist(agent, woodNode) === 0) {
        return {
          intention: 'gather_wood',
          action: 'gather',
          target: { type: 'resource', id: woodNode.id },
          reason: 'Gathering wood.',
        };
      }
      return {
        intention: 'gather_wood',
        action: 'move',
        target: { x: woodNode.x, y: woodNode.y },
        reason: `Moving to wood at (${woodNode.x},${woodNode.y}).`,
      };
    }
  }

  // Claim a house if none and one is free
  if (!agent.homeId) {
    const freeHouse = world.buildings.find(b => b.type === 'house' && !b.ownerId);
    if (freeHouse && dist(agent, freeHouse) <= 6) {
      if (dist(agent, freeHouse) === 0) {
        return {
          intention: 'claim_home',
          action: 'claim_house',
          target: { type: 'building', id: freeHouse.id },
          reason: 'Claiming this house as home.',
        };
      }
      return {
        intention: 'claim_home',
        action: 'move',
        target: { x: freeHouse.x, y: freeHouse.y },
        reason: 'Moving toward an empty house.',
      };
    }
  }

  // Build something simple if we have wood (very basic – place a marker / improve)
  // For Phase 1 we keep building minimal: only claim existing houses.

  // Default: wander / explore
  const dirs = [
    { x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 },
    { x: -1, y: -1 }, { x: 1, y: -1 }, { x: -1, y: 1 }, { x: 1, y: 1 },
  ];
  // Prefer toward unexplored or resources if   let targetX = agent.x;
  let targetY = agent.y;
  if (hasTrait(agent, 'curious') || Math.random() < 0.6) {
    const d = dirs[Math.floor(Math.random() * dirs.length)];
    targetX = Math.max(0, Math.min(MAP_W - 1, agent.x + d.x));
    targetY = Math.max(0, Math.min(MAP_H - 1, agent.y + d.y));
  }

  // Avoid walking into deep river if possible (simple)
  const t = getTile(world, targetX, targetY);
  if (t === TILE.RIVER && Math.random() < 0.7) {
    // stay or pick another
    const d2 = dirs[Math.floor(Math.random() * dirs.length)];
    targetX = Math.max(0, Math.min(MAP_W - 1, agent.x + d2.x));
    targetY = Math.max(0, Math.min(MAP_H - 1, agent.y + d2.y));
  }

  return {
    intention: 'explore',
    action: 'move',
    target: { x: targetX, y: targetY },
    reason: 'Exploring the area.',
  };
}

/**
 * Possible actions the engine understands:
 * - move {x,y}
 * - gather {resourceId}
 * - eat
 * - rest
 * - talk {agentId, topic}
 * - claim_house {buildingId}
 * - give {agentId, item, amount}  (used internally by talk outcomes)
 */

/**
 * AI World — Simulation Engine
 * Validates and executes agent proposals. Never lets agents mutate world directly.
 */

const ACTION_COSTS = {
  move: 1,      // energy
  gather: 3,
  eat: 0,
  rest: -8,   // recovers
  talk: 1,
  claim_house: 2,
};

/** Execute one full simulation step for all agents (≈ 15–30 min of world time) */
function simulationStep(world, minutesPerStep = 20) {
  // 1. Time passes
  advanceTime(world, minutesPerStep);

  // 2. Passive needs drain
  const night = isNight(world);
  for (const agent of world.agents) {
    let drain = night ? 1.2 : 0.7;
    if (world.weather === 'rain') drain += 0.3;
    agent.energy = Math.max(0, agent.energy - drain);
    // mood slowly drifts toward 50 if nothing happens
    if (agent.mood > 55) agent.mood -= 0.3;
    else if (agent.mood < 45) agent.mood += 0.2;
  }

  // 3. Each agent observes → remembers → decides → proposes
  const proposals = [];
  for (const agent of world.agents) {
    if (agent.energy <= 0) {
      // collapsed – can only rest if someone helps later; for now just skip
      agent.currentAction = 'collapsed';
      agent.intention = 'survive';
      continue;
    }

    const observation = observe(agent, world);
    addShortMemory(agent, observation, world.tick);

    const decision = decide(agent, world);
    agent.intention = decision.intention;
    agent.currentAction = decision.action;

    proposals.push({
      agentId: agent.id,
      decision,
    });
  }

  // 4. Validate & execute proposals (order randomised a bit to avoid bias)
  const order = [...proposals].sort(() => Math.random() - 0.5);
  for (const { agentId, decision } of order) {
    const agent = world.agents.find(a => a.id === agentId);
    if (!agent || agent.energy <= 0) continue;

    const result = executeAction(world, agent, decision);
    // result is recorded inside executeAction via logEvent + memories
  }

  // 5. Very low chance of spontaneous global event (keeps log interesting)
  if (Math.random() < 0.04) {
    const msgs = [
      'A cool wind moves through the village.',
      'Birds call from the forest.',
      'The river sounds louder than usual.',
      'Clouds drift slowly overhead.',
    ];
    logEvent(world, msgs[Math.floor(Math.random() * msgs.length)], false);
  }
}

/**
 * Validate + execute a single proposed action.
 * Returns { ok, message }
 */
function executeAction(world, agent, decision) {
  const { action, target, reason } = decision;

  switch (action) {
    case 'move':
      return doMove(world, agent, target, reason);
    case 'gather':
      return doGather(world, agent, target, reason);
    case 'eat':
      return doEat(world, agent, reason);
    case 'rest':
      return doRest(world, agent, reason);
    case 'talk':
      return doTalk(world, agent, target, reason);
    case 'claim_house':
      return doClaimHouse(world, agent, target, reason);
    default:
      return { ok: false, message: `Unknown action: ${action}` };
  }
}

function doMove(world, agent, target, reason) {
  if (!target || target.x === undefined) return { ok: false, message: 'No target' };
  const tx = Math.round(target.x);
  const ty = Math.round(target.y);
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) {
    return { ok: false, message: 'Out of bounds' };
  }
  // can only move 1 tile per step (simple)
  const dx = Math.sign(tx - agent.x);
  const dy = Math.sign(ty - agent.y);
  const nx = agent.x + dx;
  const ny = agent.y + dy;

  // river crossing costs extra energy
  const tile = getTile(world, nx, ny);
  let cost = ACTION_COSTS.move;
  if (tile === TILE.RIVER) cost += 2;

  if (agent.energy < cost) {
    return { ok: false, message: 'Too tired to move' };
  }

  agent.x = nx;
  agent.y = ny;
  agent.energy -= cost;

  // quiet movement – only log occasionally or when arriving at interesting place
  if (tile === TILE.HOUSE || tile === TILE.FOREST || Math.random() < 0.15) {
    // silent most of the time
  }
  return { ok: true, message: `Moved to (${nx},${ny})` };
}

function doGather(world, agent, target, reason) {
  if (!target || target.type !== 'resource') return { ok: false, message: 'Invalid target' };
  const node = world.resources.find(r => r.id === target.id);
  if (!node || node.amount <= 0) {
    addShortMemory(agent, 'Tried to gather but nothing left.', world.tick);
    return { ok: false, message: 'Resource depleted' };
  }
  if (dist(agent, node) > 0) {
    return { ok: false, message: 'Not at resource' };
  }
  if (agent.energy < ACTION_COSTS.gather) {
    return { ok: false, message: 'Too tired' };
  }

  const take = Math.min(2 + Math.floor(Math.random() * 2), node.amount);
  node.amount -= take;
  agent.inventory[node.type] = (agent.inventory[node.type] || 0) + take;
  agent.energy -= ACTION_COSTS.gather;
  agent.mood = Math.min(100, agent.mood + 3);

  const msg = `${agent.name} gathered ${take} ${node.type}.`;
  logEvent(world, msg, false, [agent.id]);
  addShortMemory(agent, `Gathered ${take} ${node.type}.`, world.tick);
  if (node.amount <= 0) {
    logEvent(world, `The ${node.type} source at (${node.x},${node.y}) is depleted.`, true);
  }
  return { ok: true, message: msg };
}

function doEat(world, agent, reason) {
  if (agent.inventory.food <= 0) {
    return { ok: false, message: 'No food' };
  }
  agent.inventory.food -= 1;
  agent.energy = Math.min(100, agent.energy + 28);
  agent.mood = Math.min(100, agent.mood + 5);

  const msg = `${agent.name} ate some food.`;
  logEvent(world, msg, false, [agent.id]);
  addShortMemory(agent, 'Ate food. Feeling better.', world.tick);
  return { ok: true, message: msg };
}

function doRest(world, agent, reason) {
  const recover = isNight(world) ? 12 : 6;
  agent.energy = Math.min(100, agent.energy + recover);
  agent.mood = Math.min(100, agent.mood + 2);
  agent.energy = Math.max(0, agent.energy - 0.5); // tiny cost already applied earlier

  // only log sometimes
  if (Math.random() < 0.3) {
    logEvent(world, `${agent.name} is resting.`, false, [agent.id]);
  }
  addShortMemory(agent, 'Rested.', world.tick);
  return { ok: true, message: 'Rested' };
}

function doTalk(world, agent, target, reason) {
  if (!target || target.type !== 'agent') return { ok: false, message: 'No one to talk to' };
  const other = world.agents.find(a => a.id === target.id);
  if (!other) return { ok: false, message: 'Agent not found' };
  if (dist(agent, other) > 2) return { ok: false, message: 'Too far' };

  agent.energy -= ACTION_COSTS.talk;
  const topic = target.topic || 'chat';
  let msg = '';
  let important = false;

  if (topic === 'ask_food') {
    if (other.inventory.food > 0 && (hasTrait(other, 'generous') || getRelScore(other, agent.id) > 10 || Math.random() < 0.35)) {
      other.inventory.food -= 1;
      agent.inventory.food = (agent.inventory.food || 0) + 1;
      adjustRelationship(agent, other.id, 12, `Gave me food`, world.tick);
      adjustRelationship(other, agent.id, 8, `I gave food`, world.tick);
      msg = `${agent.name} asked ${other.name} for food. ${other.name} shared some.`;
      important = true;
      addLongMemory(agent, `${other.name} gave me food when I was hungry.`, world.tick);
      addLongMemory(other, `I gave food to ${agent.name}.`, world.tick);
      agent.mood = Math.min(100, agent.mood + 10);
      other.mood = Math.min(100, other.mood + 4);
    } else {
      adjustRelationship(agent, other.id, -6, `Refused food`, world.tick);
      adjustRelationship(other, agent.id, -2, `Refused to give food`, world.tick);
      msg = `${agent.name} asked ${other.name} for food. ${other.name} refused.`;
      important = true;
      addShortMemory(agent, `${other.name} refused to give food.`, world.tick);
      addShortMemory(other, `${agent.name} asked for food; I said no.`, world.tick);
      agent.mood = Math.max(0, agent.mood - 5);
    }
  } else if (topic === 'offer_food') {
    if (agent.inventory.food > 0) {
      agent.inventory.food -= 1;
      other.inventory.food = (other.inventory.food || 0) + 1;
      adjustRelationship(agent, other.id, 6, `I offered food`, world.tick);
      adjustRelationship(other, agent.id, 14, `Received food`, world.tick);
      msg = `${agent.name} offered food to ${other.name}.`;
      important = true;
      addLongMemory(other, `${agent.name} kindly gave me food.`, world.tick);
      other.mood = Math.min(100, other.mood + 8);
      agent.mood = Math.min(100, agent.mood + 5);
    } else {
      msg = `${agent.name} wanted to offer food but had none.`;
    }
  } else if (topic === 'offer_wood') {
    if (agent.inventory.wood > 0) {
      agent.inventory.wood -= 1;
      other.inventory.wood = (other.inventory.wood || 0) + 1;
      adjustRelationship(agent, other.id, 5, `I offered wood`, world.tick);
      adjustRelationship(other, agent.id, 10, `Received wood`, world.tick);
      msg = `${agent.name} gave wood to ${other.name}.`;
      important = true;
    }
  } else if (topic === 'confront') {
    adjustRelationship(agent, other.id, -8, `Confrontation`, world.tick);
    adjustRelationship(other, agent.id, -10, `Was confronted`, world.tick);
    msg = `${agent.name} confronted ${other.name} about past issues.`;
    important = true;
    agent.mood = Math.max(0, agent.mood - 3);
    other.mood = Math.max(0, other.mood - 6);
  } else {
    // simple chat
    const delta = hasTrait(agent, 'sociable') || hasTrait(other, 'sociable') ? 4 : 2;
    adjustRelationship(agent, other.id, delta, `Chat`, world.tick);
    adjustRelationship(other, agent.id, delta, `Chat`, world.tick);
    msg = `${agent.name} talked with ${other.name}.`;
    agent.mood = Math.min(100, agent.mood + 3);
    other.mood = Math.min(100, other.mood + 3);
    addShortMemory(agent, `Chatted with ${other.name}.`, world.tick);
    addShortMemory(other, `Chatted with ${agent.name}.`, world.tick);
  }

  if (msg) {
    logEvent(world, msg, important, [agent.id, other.id]);
  }
  return { ok: true, message: msg };
}

function doClaimHouse(world, agent, target, reason) {
  if (!target || target.type !== 'building') return { ok: false, message: 'Invalid' };
  const building = world.buildings.find(b => b.id === target.id);
  if (!building || building.type !== 'house') return { ok: false, message: 'Not a house' };
  if (building.ownerId) {
    addShortMemory(agent, 'House already claimed.', world.tick);
    return { ok: false, message: 'Already owned' };
  }
  if (dist(agent, building) > 0) return { ok: false, message: 'Not at house' };

  building.ownerId = agent.id;
  agent.homeId = building.id;
  agent.mood = Math.min(100, agent.mood + 12);

  const msg = `${agent.name} claimed a house as home.`;
  logEvent(world, msg, true, [agent.id]);
  addLongMemory(agent, 'I claimed a house. It is my home now.', world.tick);
  return { ok: true, message: msg };
}

/**
 * AI World — UI rendering (canvas map + panels)
 */
let selectedAgentId = null;
let canvas, ctx;

function initUI() {
  canvas = document.getElementById('world-canvas');
  ctx = canvas.getContext('2d');

  // agent list clicks
  document.getElementById('agent-list').addEventListener('click', (e) => {
    const card = e.target.closest('.agent-card');
    if (card) {
      selectedAgentId = card.dataset.id;
      showAgentDetail(selectedAgentId);
    }
  });

  document.getElementById('btn-close-detail').addEventListener('click', () => {
    selectedAgentId = null;
    document.getElementById('agent-detail').classList.add('hidden');
    document.getElementById('agent-list').style.display = '';
  });

  document.getElementById('btn-clear-log').addEventListener('click', () => {
    if (window.world) {
      window.world.events = [];
      renderEventLog(window.world);
    }
  });
}

function renderAll(world) {
  renderMap(world);
  renderStats(world);
  renderEventLog(world);
  renderAgentList(world);
  if (selectedAgentId) showAgentDetail(selectedAgentId);
  document.getElementById('time-display').textContent = formatTime(world);
  document.getElementById('weather-display').textContent =
    world.weather.charAt(0).toUpperCase() + world.weather.slice(1);
}

function renderStats(world) {
  document.getElementById('pop-stat').textContent = `Pop: ${world.agents.length}`;
  const foodLeft = totalResourceLeft(world, 'food') + world.global.food;
  const woodLeft = totalResourceLeft(world, 'wood') + world.global.wood;
  document.getElementById('food-stat').textContent = `Food: ${foodLeft}`;
  document.getElementById('wood-stat').textContent = `Wood: ${woodLeft}`;
}

function renderMap(world) {
  const tw = canvas.width / MAP_W;
  const th = canvas.height / MAP_H;

  // tiles
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const tile = world.map[y][x];
      ctx.fillStyle = TILE_COLORS[tile] || '#111';
      ctx.fillRect(x * tw, y * th, tw + 0.5, th + 0.5);
    }
  }

  // resource nodes
  for (const r of world.resources) {
    if (r.amount <= 0) continue;
    ctx.fillStyle = r.type === 'food' ? '#ff7043' : '#8d6e63';
    ctx.beginPath();
    ctx.arc((r.x + 0.5) * tw, (r.y + 0.5) * th, Math.min(tw, th) * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  // buildings already drawn as house tiles; mark owned ones
  for (const b of world.buildings) {
    if (b.ownerId) {
      ctx.strokeStyle = '#ffee58';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x * tw + 1, b.y * th + 1, tw - 2, th - 2);
    }
  }

  // agents
  for (const a of world.agents) {
    const cx = (a.x + 0.5) * tw;
    const cy = (a.y + 0.5) * th;
    // body
    ctx.fillStyle = a.energy < 15 ? '#ef5350' : '#ffee58';
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(tw, th) * 0.32, 0, Math.PI * 2);
    ctx.fill();
    // name label
    ctx.fillStyle = '#e7ecf3';
    ctx.font = `${Math.max(9, tw * 0.55)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(a.name.slice(0, 4), cx, cy - th * 0.4);
  }
}

function renderEventLog(world) {
  const el = document.getElementById('event-log');
  // show newest at top, limit DOM nodes
  const events = world.events.slice(-120).reverse();
  el.innerHTML = events.map(e => {
    const t = `Day ${e.day} — ${String(e.hour).padStart(2,'0')}:${String(e.minute).padStart(2,'0')}`;
    return `<div class="event-entry${e.important ? ' important' : ''}">
      <span class="event-time">${t}</span>
      <span class="event-text">${escapeHtml(e.text)}</span>
    </div>`;
  }).join('');
}

function renderAgentList(world) {
  if (selectedAgentId) return; // detail view open
  const list = document.getElementById('agent-list');
  list.innerHTML = world.agents.map(a => {
    const status = a.currentAction || a.intention || '…';
    return `<div class="agent-card" data-id="${a.id}">
      <div class="agent-card-name">${escapeHtml(a.name)}</div>
      <div class="agent-card-meta">${a.traits.join(', ')} · ⚡${Math.round(a.energy)} · 😊${Math.round(a.mood)}</div>
      <div class="agent-card-status">${escapeHtml(status)}</div>
    </div>`;
  }).join('');
}

function showAgentDetail(agentId) {
  const world = window.world;
  if (!world) return;
  const a = world.agents.find(x => x.id === agentId);
  if (!a) return;

  document.getElementById('agent-list').style.display = 'none';
  const detail = document.getElementById('agent-detail');
  detail.classList.remove('hidden');

  const home = a.homeId ? 'Has a home' : 'No home yet';
  const inv = `Food: ${a.inventory.food || 0} · Wood: ${a.inventory.wood || 0} · Money: ${a.money}`;

  // relationships
  let relHtml = '<em>None yet</em>';
  const rels = Object.entries(a.relationships);
  if (rels.length) {
    relHtml = rels.map(([oid, r]) => {
      const other = world.agents.find(x => x.id === oid);
      const name = other ? other.name : oid;
      const cls = r.score > 15 ? 'rel-positive' : r.score < -15 ? 'rel-negative' : 'rel-neutral';
      return `<div class="rel-item ${cls}">${escapeHtml(name)}: ${r.score > 0 ? '+' : ''}${r.score}</div>`;
    }).join('');
  }

  // memories
  const mems = [...a.longTerm.slice(0, 6), ...a.shortTerm.slice(0, 4)];
  const memHtml = mems.length
    ? mems.map(m => `<div class="mem-item">${escapeHtml(m.text)}</div>`).join('')
    : '<em>No memories yet</em>';

  const histHtml = a.history.length
    ? a.history.slice(0, 8).map(h => `<div class="mem-item">${escapeHtml(h.text)}</div>`).join('')
    : '<em>—</em>';

  document.getElementById('agent-info').innerHTML = `
    <h3>${escapeHtml(a.name)}</h3>
    <div class="agent-card-meta">${a.traits.join(' · ')}</div>
    <div style="margin-top:6px;font-size:0.85rem">Location: (${a.x}, ${a.y}) · ${home}</div>
    <div style="font-size:0.85rem;margin-top:2px">Intention: <strong>${escapeHtml(a.intention)}</strong></div>
    <div style="font-size:0.85rem">Action: ${escapeHtml(a.currentAction || '—')}</div>

    <div class="section">
      <div class="section-title">Energy</div>
      <div class="bar"><div class="bar-fill energy" style="width:${a.energy}%"></div></div>
      <div class="section-title" style="margin-top:8px">Mood</div>
      <div class="bar"><div class="bar-fill mood" style="width:${a.mood}%"></div></div>
    </div>

    <div class="section">
      <div class="section-title">Possessions</div>
      <div class="pos-item">${inv}</div>
    </div>

    <div class="section">
      <div class="section-title">Relationships</div>
      ${relHtml}
    </div>

    <div class="section">
      <div class="section-title">Recent Memories</div>
      ${memHtml}
    </div>

    <div class="section">
      <div class="section-title">Important History</div>
      ${histHtml}
    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**
 * AI World — Application entry & controls
 */

const STORAGE_KEY = 'ai_world_save_v1';

let world = null;
let running = false;
let speed = 5;          // steps per second (approx)
let loopTimer = null;
const MINUTES_PER_STEP = 20;

function createFreshWorld() {
  const w = createWorld();
  w.agents = createInitialAgents();
  // give each a tiny starting memory
  for (const a of w.agents) {
    addShortMemory(a, 'I woke up in this village.', 0);
    addLongMemory(a, 'I exist in this world. I can observe and decide what to do.', 0);
  }
  logEvent(w, 'The world begins. Five inhabitants open their eyes.', true);
  logEvent(w, 'Minimal instruction given: "You exist in this world. You can observe your surroundings, interact with the world and interact with other inhabitants. Decide what you want to do."', true);
  return w;
}

function saveWorld() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(world));
  } catch (e) {
    console.warn('Save failed', e);
  }
}

function loadWorld() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.agents || !data.map) return null;
    return data;
  } catch (e) {
    return null;
  }
}

function start() {
  world = loadWorld() || createFreshWorld();
  window.world = world; // for debugging & UI
  initUI();
  renderAll(world);
  bindControls();
  // auto-save every 30s
  setInterval(saveWorld, 30000);
}

function bindControls() {
  const btnRun = document.getElementById('btn-run');
  const btnPause = document.getElementById('btn-pause');
  const btnHour = document.getElementById('btn-hour');
  const btnDay = document.getElementById('btn-day');
  const btnReset = document.getElementById('btn-reset');
  const speedSelect = document.getElementById('speed-select');

  btnRun.addEventListener('click', () => {
    running = true;
    btnRun.disabled = true;
    btnPause.disabled = false;
    scheduleLoop();
  });

  btnPause.addEventListener('click', () => {
    running = false;
    btnRun.disabled = false;
    btnPause.disabled = true;
    if (loopTimer) clearTimeout(loopTimer);
  });

  btnHour.addEventListener('click', () => {
    // advance ~3 steps (1 hour)
    for (let i = 0; i < 3; i++) simulationStep(world, MINUTES_PER_STEP);
    renderAll(world);
    saveWorld();
  });

  btnDay.addEventListener('click', () => {
    // 24h ≈ 72 steps
    for (let i = 0; i < 72; i++) simulationStep(world, MINUTES_PER_STEP);
    renderAll(world);
    saveWorld();
  });

  btnReset.addEventListener('click', () => {
    if (!confirm('Reset the world? All progress will be lost.')) return;
    running = false;
    btnRun.disabled = false;
    btnPause.disabled = true;
    if (loopTimer) clearTimeout(loopTimer);
    localStorage.removeItem(STORAGE_KEY);
    world = createFreshWorld();
    window.world = world;
    selectedAgentId = null;
    document.getElementById('agent-detail').classList.add('hidden');
    document.getElementById('agent-list').style.display = '';
    renderAll(world);
  });

  speedSelect.addEventListener('change', () => {
    speed = parseInt(speedSelect.value, 10) || 5;
  });
  speed = parseInt(speedSelect.value, 10) || 5;
}

function scheduleLoop() {
  if (!running) return;
  const delay = Math.max(30, 1000 / speed);
  loopTimer = setTimeout(() => {
    simulationStep(world, MINUTES_PER_STEP);
    renderAll(world);
    // periodic save
    if (world.tick % 200 === 0) saveWorld();
    scheduleLoop();
  }, delay);
}

// boot
document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
