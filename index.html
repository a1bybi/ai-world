<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI World — Unified Map Engine</title>
  <style>
    :root {
      --bg: #0b0e14; --panel: #151b26; --border: #232d3f; 
      --text: #c9d1d9; --muted: #7a8a9e; --accent: #00e676; 
      --warning: #ffb74d; --info: #29b6f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: bold; color: var(--accent); font-size: 1.1rem; letter-spacing: 1px; }
    .stats { display: flex; gap: 20px; font-size: 0.85rem; }
    .stat-val { font-weight: bold; color: #fff; }

    .main-container { display: grid; grid-template-columns: 1fr 320px; flex: 1; min-height: 0; }
    
    .map-container { position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
    canvas { background: #132413; border-radius: 6px; box-shadow: 0 0 20px rgba(0,0,0,0.8); image-rendering: pixelated; }

    .sidebar { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .section-title { padding: 10px; background: rgba(0,0,0,0.2); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
    
    .scroll-area { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.85rem; }
    .log-item { margin-bottom: 8px; line-height: 1.3; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
    .log-time { color: var(--muted); font-size: 0.75rem; }
    .log-name { color: var(--info); font-weight: bold; }

    .progress-bar-bg { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.2s; }
    
    .controls { display: flex; gap: 8px; }
    button, select { background: var(--border); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    button:hover { background: #2f3c53; }
  </style>
</head>
<body>

  <header>
    <div class="title">AI WORLD: UNIFIED MAP SIMULATOR</div>
    <div class="stats">
      <div>Day: <span id="ui-day" class="stat-val">1</span></div>
      <div>Pop: <span id="ui-pop" class="stat-val">0</span></div>
      <div>Food: <span id="ui-food" class="stat-val">0</span></div>
      <div>Wood: <span id="ui-wood" class="stat-val">0</span></div>
      <div>Era: <span id="ui-era" class="stat-val" style="color:var(--warning)">Primitive</span></div>
    </div>
    <div class="controls">
      <select id="speed-select">
        <option value="1">1x Speed</option>
        <option value="2" selected>2x Speed (Paced)</option>
        <option value="5">5x Speed</option>
      </select>
      <button id="pause-btn">Pause</button>
    </div>
  </header>

  <div class="main-container">
    <div class="map-container">
      <canvas id="world" width="900" height="675"></canvas>
    </div>

    <div class="sidebar">
      <div class="section-title">Era & Research Pacing</div>
      <div style="padding: 10px; border-bottom: 1px solid var(--border)">
        <div style="display:flex; justify-content:space-between; font-size:0.8rem">
          <span>Target Discovery</span>
          <span id="ui-insight-num">0 / 250</span>
        </div>
        <div class="progress-bar-bg"><div id="ui-insight-bar" class="progress-bar-fill"></div></div>
      </div>

      <div class="section-title">Spatial Log & Dialogues</div>
      <div id="log-list" class="scroll-area"></div>
    </div>
  </div>

  <script>
    const MAP_W = 60, MAP_H = 45;
    const TILE = { GRASS: 0, FOREST: 1, WATER: 2, PATH: 3, ROAD: 4 };

    const ERAS = [
      { name: "Primitive", color: "#8d6e63", reqInsight: 250 },
      { name: "Bronze Age", color: "#ffb300", reqInsight: 750 },
      { name: "Iron Age", color: "#9e9e9e", reqInsight: 2000 },
      { name: "Medieval", color: "#5c6bc0", reqInsight: 5000 },
      { name: "Industrial", color: "#bf360c", reqInsight: 12000 },
      { name: "Modern", color: "#29b6f6", reqInsight: 30000 },
      { name: "Information", color: "#ab47bc", reqInsight: 75000 },
      { name: "Space Age", color: "#00e676", reqInsight: 180000 }
    ];

    let state = {
      tick: 0, day: 1, running: true, speed: 2,
      map: [], paths: [],
      agents: [], buildings: [], resources: [],
      global: { food: 40, wood: 40, insight: 0 },
      currentEra: 0,
      speechBubbles: [] // { x, y, text, time }
    };

    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");

    function init() {
      // Build terrain map
      for (let y = 0; y < MAP_H; y++) {
        state.map[y] = []; state.paths[y] = [];
        for (let x = 0; x < MAP_W; x++) {
          let type = TILE.GRASS;
          if (Math.random() < 0.18) type = TILE.FOREST;
          if (x > MAP_W - 6 || (x > MAP_W - 10 && Math.random() < 0.4)) type = TILE.WATER;
          state.map[y][x] = type;
          state.paths[y][x] = 0;
        }
      }

      // Initial settlement structure on map
      let hX = Math.floor(MAP_W / 3), hY = Math.floor(MAP_H / 2);
      state.map[hY][hX] = TILE.GRASS;
      state.buildings.push({ x: hX, y: hY, level: 1, cap: 6 });

      // Spawn initial villagers
      for(let i = 0; i < 4; i++) spawnAgent(hX, hY);

      // Populate resource nodes on physical tiles
      spawnResources();
      requestAnimationFrame(loop);
    }

    function spawnAgent(x, y) {
      const names = ["Ael", "Bryn", "Cael", "Dara", "Eon", "Fay", "Gael", "Hale", "Ira", "Jace", "Kira", "Lorn"];
      state.agents.push({
        id: Math.random().toString(36).substr(2, 4),
        name: names[Math.floor(Math.random() * names.length)],
        x: x, y: y,
        targetX: x, targetY: y,
        energy: 100,
        task: "idle"
      });
    }

    function spawnResources() {
      for(let i = 0; i < 8; i++) {
        let rx = Math.floor(Math.random() * (MAP_W - 12));
        let ry = Math.floor(Math.random() * MAP_H);
        if (state.map[ry][rx] === TILE.GRASS) {
          state.resources.push({ x: rx, y: ry, type: Math.random() > 0.5 ? 'food' : 'wood', amount: 100 });
        }
      }
    }

    function update() {
      state.tick++;
      if (state.tick % 100 === 0) {
        state.day++;
        if (state.resources.length < 12) spawnResources();
      }

      let reqInsight = ERAS[state.currentEra].reqInsight;

      // Agent Logic & Movement
      state.agents.forEach(a => {
        a.energy -= 0.03; // Real movement cost slows progression naturally

        // Slower Insight Generation tied to well-being & era depth
        if (a.energy > 60) {
          state.global.insight += 0.02 / (state.currentEra + 1);
        }

        if (a.task === "idle" || (a.x === a.targetX && a.y === a.targetY)) {
          assignTask(a);
        } else {
          // Physical walking on grid
          if (a.x !== a.targetX) a.x += Math.sign(a.targetX - a.x);
          else if (a.y !== a.targetY) a.y += Math.sign(a.targetY - a.y);

          // Foot traffic dynamically carves dirt trails
          if (state.map[a.y][a.x] === TILE.GRASS) {
            state.paths[a.y][a.x]++;
            if (state.paths[a.y][a.x] > 40) state.map[a.y][a.x] = TILE.PATH;
          } else if (state.map[a.y][a.x] === TILE.PATH && state.currentEra >= 3 && state.paths[a.y][a.x] > 120) {
            state.map[a.y][a.x] = TILE.ROAD; // Auto-pave stone roads in higher eras
          }
        }

        // On-Map Contextual Conversations
        if (Math.random() < 0.003) triggerContextualChat(a);
      });

      // Spatial Construction: Expand buildings when population nears capacity
      let capacity = state.buildings.reduce((sum, b) => sum + b.cap, 0);
      if (state.agents.length >= capacity && state.global.wood >= 30) {
        let builder = state.agents[Math.floor(Math.random() * state.agents.length)];
        let bx = Math.min(MAP_W - 12, Math.max(2, builder.x + Math.floor(Math.random() * 5 - 2)));
        let by = Math.min(MAP_H - 2, Math.max(2, builder.y + Math.floor(Math.random() * 5 - 2)));

        if (state.map[by][bx] === TILE.GRASS && !state.buildings.find(b => b.x === bx && b.y === by)) {
          state.global.wood -= 30;
          state.buildings.push({ x: bx, y: by, level: 1, cap: 6 * (state.currentEra + 1) });
          addLog(`🏗️ Built new structure at (${bx}, ${by})`);
          addBubble(bx, by, "New home built!");
        }
      }

      // Births require both food AND spatial housing capacity
      if (state.global.food > state.agents.length * 5 && state.agents.length < capacity && Math.random() < 0.01) {
        state.global.food -= 10;
        let b = state.buildings[Math.floor(Math.random() * state.buildings.length)];
        spawnAgent(b.x, b.y);
        addLog(`👶 A new citizen was born.`);
      }

      // Era Upgrade check
      if (state.global.insight >= reqInsight && state.currentEra < ERAS.length - 1) {
        state.currentEra++;
        addLog(`🌍 ADVANCEMENT: Society reached the ${ERAS[state.currentEra].name}!`);
        // Upgrade housing capacity on map buildings
        state.buildings.forEach(b => { b.cap *= 2; b.level++; });
      }

      // Expire old map speech bubbles
      state.speechBubbles = state.speechBubbles.filter(b => state.tick - b.time < 80);

      updateUI();
    }

    function assignTask(a) {
      if (a.energy < 30 && state.global.food > 0) {
        state.global.food--; a.energy = 100;
        return;
      }

      // Look for physical resources nearby
      let res = state.resources[Math.floor(Math.random() * state.resources.length)];
      if (res) {
        a.targetX = res.x; a.targetY = res.y;
        if (a.x === res.x && a.y === res.y) {
          res.amount -= 10;
          state.global[res.type] += 10;
          if (res.amount <= 0) state.resources = state.resources.filter(r => r !== res);
        }
        return;
      }

      // Wander nearby
      a.targetX = Math.min(MAP_W - 12, Math.max(1, a.x + Math.floor(Math.random() * 9 - 4)));
      a.targetY = Math.min(MAP_H - 1, Math.max(1, a.y + Math.floor(Math.random() * 9 - 4)));
    }

    function triggerContextualChat(agent) {
      let other = state.agents.find(o => o !== agent && Math.abs(o.x - agent.x) < 3 && Math.abs(o.y - agent.y) < 3);
      if (!other) return;

      let msg = "Nice weather.";
      if (agent.energy < 40) msg = "I need food soon...";
      else if (state.global.wood < 20) msg = "We are low on timber.";
      else if (state.currentEra > 0) msg = `The ${ERAS[state.currentEra].name} brings new hope.`;

      addBubble(agent.x, agent.y, msg);
      addLog(`<span class="log-name">${agent.name}</span>: "${msg}"`);
    }

    function addBubble(x, y, text) {
      state.speechBubbles.push({ x, y, text, time: state.tick });
    }

    function addLog(html) {
      let container = document.getElementById("log-list");
      container.insertAdjacentHTML('afterbegin', `<div class="log-item"><span class="log-time">Day ${state.day}</span> ${html}</div>`);
      if (container.children.length > 40) container.removeChild(container.lastChild);
    }

    function updateUI() {
      document.getElementById("ui-day").innerText = state.day;
      document.getElementById("ui-pop").innerText = state.agents.length;
      document.getElementById("ui-food").innerText = state.global.food;
      document.getElementById("ui-wood").innerText = state.global.wood;

      let era = ERAS[state.currentEra];
      document.getElementById("ui-era").innerText = era.name;
      document.getElementById("ui-era").style.color = era.color;

      document.getElementById("ui-insight-num").innerText = `${Math.floor(state.global.insight)} / ${era.reqInsight}`;
      document.getElementById("ui-insight-bar").style.width = `${Math.min(100, (state.global.insight / era.reqInsight) * 100)}%`;
    }

    function draw() {
      let tw = canvas.width / MAP_W;
      let th = canvas.height / MAP_H;

      // Render Map Grid
      for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
          let t = state.map[y][x];
          if (t === TILE.GRASS) ctx.fillStyle = "#1b3320";
          else if (t === TILE.FOREST) ctx.fillStyle = "#0d2412";
          else if (t === TILE.WATER) ctx.fillStyle = "#154360";
          else if (t === TILE.PATH) ctx.fillStyle = "#3e2723";
          else if (t === TILE.ROAD) ctx.fillStyle = "#546e7a";

          ctx.fillRect(x * tw, y * th, tw + 0.5, th + 0.5);

          if (t === TILE.FOREST) {
            ctx.fillStyle = "#2e7d32";
            ctx.beginPath();
            ctx.arc(x * tw + tw / 2, y * th + th / 2, tw * 0.35, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Draw Physical Resources
      state.resources.forEach(r => {
        ctx.fillStyle = r.type === 'food' ? "#e53935" : "#8d6e63";
        ctx.fillRect(r.x * tw + tw * 0.2, r.y * th + th * 0.2, tw * 0.6, th * 0.6);
      });

      // Draw Spatial Buildings (Art shifts per era)
      state.buildings.forEach(b => {
        ctx.fillStyle = ERAS[state.currentEra].color;
        let sz = tw * (0.7 + b.level * 0.05);
        ctx.fillRect(b.x * tw, b.y * th, sz, sz);
        ctx.strokeStyle = "#000"; ctx.strokeRect(b.x * tw, b.y * th, sz, sz);
      });

      // Draw Physical Agents
      state.agents.forEach(a => {
        ctx.fillStyle = a.energy < 30 ? "#ff5252" : "#00e676";
        ctx.beginPath();
        ctx.arc(a.x * tw + tw / 2, a.y * th + th / 2, tw * 0.3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Speech Bubbles Over Map Grid
      state.speechBubbles.forEach(b => {
        let px = b.x * tw;
        let py = b.y * th - 8;

        ctx.font = "10px sans-serif";
        let textWidth = ctx.measureText(b.text).width;

        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(px - 4, py - 12, textWidth + 8, 14);

        ctx.fillStyle = "#fff";
        ctx.fillText(b.text, px, py);
      });
    }

    let lastTime = 0;
    function loop(time) {
      if (state.running) {
        let delta = time - lastTime;
        if (delta > (1000 / (30 * state.speed))) {
          update();
          draw();
          lastTime = time;
        }
      }
      requestAnimationFrame(loop);
    }

    document.getElementById("pause-btn").onclick = (e) => {
      state.running = !state.running;
      e.target.innerText = state.running ? "Pause" : "Resume";
      if (state.running) requestAnimationFrame(loop);
    };

    document.getElementById("speed-select").onchange = (e) => {
      state.speed = parseInt(e.target.value);
    };

    init();
  </script>
</body>
</html>
