<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AI World — Autonomous Artificial Society & Evolution</title>
  <style>
:root {
  --bg: #0f1419;
  --panel: #1a2332;
  --border: #2d3a4f;
  --text: #e7ecf3;
  --muted: #8b9bb4;
  --accent: #4fc3f7;
  --accent-dim: #2896c4;
  --success: #66bb6a;
  --warning: #ffa726;
  --danger: #ef5350;
  --house: #a1887f;
  --forest: #43a047;
  --river: #29b6f6;
  --agent: #ffee58;
  --resource: #ff7043;
  --workshop: #ab47bc;
  --farm: #26a69a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 1450px; margin: 0 auto; position: relative; }
.header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header h1 { font-size: 1.15rem; font-weight: 600; }
.time-display { font-size: 0.9rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.era-display { font-size: 0.85rem; color: var(--warning); font-weight: 600; }
.header-controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--border); color: var(--text); border: none; border-radius: 6px; padding: 7px 12px; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; }
.btn:hover:not(:disabled) { background: #3a4a63; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent-dim); color: #fff; }
.btn.danger { background: #5c2a2a; }
.btn.small { padding: 4px 8px; font-size: 0.75rem; }
.speed-select { background: var(--border); color: var(--text); border: none; border-radius: 6px; padding: 7px 8px; font-size: 0.85rem; }
.main { display: grid; grid-template-columns: 1.2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; background: var(--border); flex: 1; min-height: 0; overflow: hidden; }
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.world-panel { grid-row: 1 / 3; }
.panel-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-header h2 { font-size: 0.95rem; font-weight: 500; }
.world-stats { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); }
.map-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; min-height: 0; overflow: hidden; }
#world-canvas { max-width: 100%; max-height: 100%; border-radius: 4px; background: #0a0e14; image-rendering: pixelated; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 12px; font-size: 0.72rem; color: var(--muted); border-top: 1px solid var(--border); flex-shrink: 0; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.dot.house { background: var(--house); }
.dot.workshop { background: var(--workshop); }
.dot.farm { background: var(--farm); }
.dot.forest { background: var(--forest); }
.dot.river { background: var(--river); }
.dot.agent { background: var(--agent); border-radius: 50%; }
.dot.resource { background: var(--resource); }
.event-log { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 0.8rem; line-height: 1.45; }
.event-entry { padding: 5px 0; border-bottom: 1px solid rgba(45, 58, 79, 0.4); }
.event-time { color: var(--muted); margin-right: 6px; font-size: 0.75rem; }
.event-entry.important .event-text { color: var(--accent); font-weight: 500; }
.event-entry.chat { color: #81d4fa; font-style: italic; }
.agent-list, .agent-detail { flex: 1; overflow-y: auto; padding: 8px; }
.agent-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.agent-card-name { font-weight: 600; font-size: 0.95rem; }
.agent-card-meta { font-size: 0.75rem; color: var(--muted); }
.agent-card-status { font-size: 0.8rem; margin-top: 4px; color: var(--accent); }
.agent-detail.hidden { display: none; }
.agent-detail h3 { font-size: 1.1rem; margin: 8px 0 4px; }
.section { margin-top: 14px; }
.section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }
.bar-fill.energy { background: var(--success); }
.bar-fill.mood { background: var(--warning); }
.library-entry, .tech-entry { background: rgba(79, 195, 247, 0.08); border-left: 2px solid var(--accent); padding: 6px 8px; margin-bottom: 6px; border-radius: 3px; font-size: 0.75rem; }
.tech-entry { background: rgba(171, 71, 188, 0.1); border-left-color: var(--workshop); }
.entry-title { color: var(--accent); font-weight: 600; }
.tech-entry .entry-title { color: #ce93d8; }
.entry-meta { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }

/* Modal Summary Styling */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 550px; max-width: 90%; max-height: 85%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 1.1rem; color: var(--accent); }
.modal-body { padding: 18px; overflow-y: auto; font-size: 0.85rem; line-height: 1.6; }
.modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1>AI World</h1>
        <span id="time-display" class="time-display">Day 1 — 06:00</span>
        <span id="era-display" class="era-display">Era: Primitive Age</span>
      </div>
      <div class="header-controls">
        <button id="btn-run" class="btn primary">▶ Run</button>
        <button id="btn-pause" class="btn" disabled>■ Pause</button>
        <button id="btn-hour" class="btn">+1 Hour</button>
        <button id="btn-day" class="btn">+1 Day</button>
        <button id="btn-reset" class="btn danger">Reset</button>
        <select id="speed-select" class="speed-select">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="5" selected>5×</option>
          <option value="10">10×</option>
          <option value="30">30×</option>
        </select>
      </div>
    </header>
    <main class="main">
      <section class="panel world-panel">
        <div class="panel-header">
          <h2>World Map & Settlement</h2>
          <div class="world-stats">
            <span id="pop-stat">Pop: 6</span>
            <span id="food-stat">Food: 0</span>
            <span id="wood-stat">Wood: 0</span>
          </div>
        </div>
        <div class="map-container"><canvas id="world-canvas" width="700" height="460"></canvas></div>
        <div class="legend">
          <span class="legend-item"><span class="dot house"></span> House</span>
          <span class="legend-item"><span class="dot workshop"></span> Workshop</span>
          <span class="legend-item"><span class="dot farm"></span> Farm</span>
          <span class="legend-item"><span class="dot forest"></span> Forest</span>
          <span class="legend-item"><span class="dot river"></span> River</span>
          <span class="legend-item"><span class="dot agent"></span> Agent</span>
          <span class="legend-item"><span class="dot resource"></span> Resource</span>
        </div>
      </section>
      <section class="panel">
        <div class="panel-header">
          <h2>Live Dialogue & Event Log</h2>
          <button id="btn-clear-log" class="btn small">Clear</button>
        </div>
        <div id="event-log" class="event-log"></div>
      </section>
      <section class="panel">
        <div class="panel-header"><h2>💡 Inventions & Library Archive</h2></div>
        <div id="library-panel" class="agent-list"></div>
      </section>
      <section class="panel">
        <div class="panel-header"><h2>Inhabitant Inspection</h2></div>
        <div id="agent-list" class="agent-list"></div>
        <div id="agent-detail" class="agent-detail hidden">
          <button id="btn-close-detail" class="btn small">← Back</button>
          <div id="agent-info"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Summary Modal -->
  <div id="summary-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>📜 Society Chronicle Summary</h2>
        <button id="btn-close-modal" class="btn small">Close</button>
      </div>
      <div id="summary-content" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-resume-btn" class="btn primary">Resume Simulation</button>
      </div>
    </div>
  </div>

  <script>
const TILE = { GRASS: 0, FOREST: 1, RIVER: 2, HOUSE: 3, PATH: 4, WORKSHOP: 5, FARM: 6 };
const TILE_COLORS = {
  [TILE.GRASS]: '#162b16', [TILE.FOREST]: '#0b3d18', [TILE.RIVER]: '#08334f',
  [TILE.HOUSE]: '#4a3728', [TILE.PATH]: '#2a2a20', [TILE.WORKSHOP]: '#5b2c6f', [TILE.FARM]: '#117a65'
};
const MAP_W = 42, MAP_H = 28;

class SocietyEvolution {
  constructor() {
    this.entries = [];
    this.inventions = [];
    this.era = 'Primitive Age';
    this.globalMultipliers = { gathering: 1.0, building: 1.0, energyEfficiency: 1.0 };
  }
  
  addKnowledge(title, category, value, discoveredBy, world) {
    const entry = { id: `lib_${this.entries.length}`, title, category, value, discoveredBy, discoveredTick: world.tick, citations: 1 };
    this.entries.push(entry);
    if (this.entries.length > 150) this.entries.shift();
    return entry;
  }

  tryProceduralInvent(agent, world) {
    const totalSkill = agent.skills.gathering + agent.skills.building;
    if (totalSkill < 35 || Math.random() > 0.16) return null;

    const prefixes = ['Advanced', 'Refined', 'Systematic', 'Experimental', 'Obsidian', 'Acoustic', 'Thermal', 'Kinetic', 'Structural', 'Hydraulic', 'Metallic'];
    const roots = ['Masonry', 'Cultivation', 'Fluid Dynamics', 'Weaving', 'Metallurgy', 'Geometry', 'Fermentation', 'Mechanics', 'Carpentry', 'Toolmaking', 'Pathfinding'];
    const suffixes = ['Analysis', 'Framework', 'Synthesis', 'Application', 'Optimization', 'Methodology', 'Principles', 'Blueprint'];

    const name = `${prefixes[Math.floor(Math.random() * prefixes.length)]} ${roots[Math.floor(Math.random() * roots.length)]} ${suffixes[Math.floor(Math.random() * suffixes.length)]}`;
    
    if (this.inventions.some(inv => inv.name === name)) return null;

    // Inventions directly upgrade world efficiency multipliers
    this.globalMultipliers.gathering += 0.08;
    this.globalMultipliers.building += 0.08;
    this.globalMultipliers.energyEfficiency += 0.05;

    this.inventions.push({ name, discoveredBy: agent.name, day: world.day, tick: world.tick });
    this.updateEra(world);
    return name;
  }

  updateEra(world) {
    const invCount = this.inventions.length;
    const libCount = this.entries.length;
    const alivePop = world.agents.filter(a => a.alive).length;

    if ((invCount >= 8 && libCount >= 15 && alivePop >= 10) || world.day >= 25) {
      this.era = 'Industrial Age';
    } else if ((invCount >= 4 && libCount >= 8 && alivePop >= 8) || world.day >= 12) {
      this.era = 'Expansion Era';
    } else if ((invCount >= 1 && libCount >= 3) || world.day >= 5) {
      this.era = 'Discovery Age';
    } else {
      this.era = 'Primitive Age';
    }
  }

  learnFromLibrary(agent) {
    const entries = this.entries.filter(e => agent.skills[e.category] !== undefined);
    if (entries.length > 0) {
      const target = entries[Math.floor(Math.random() * entries.length)];
      target.citations++;
      agent.skills[target.category] = Math.min(100, agent.skills[target.category] + target.value * 1.5);
      if (!agent.knowledgeAcquired.includes(target.title)) agent.knowledgeAcquired.push(target.title);
      return target.title;
    }
    return null;
  }
}

function createMap() {
  const map = Array.from({ length: MAP_H }, () => Array.from({ length: MAP_W }, () => TILE.GRASS));
  for (let y = 0; y < MAP_H; y++) {
    map[y][27] = TILE.RIVER; map[y][28] = TILE.RIVER;
    if (y % 4 === 0) { map[y][26] = TILE.RIVER; map[y][29] = TILE.RIVER; }
  }
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < 9; x++) { if (Math.random() > 0.2) map[y][x] = TILE.FOREST; }
    for (let x = MAP_W - 9; x < MAP_W; x++) { if (Math.random() > 0.2) map[y][x] = TILE.FOREST; }
  }
  [[14, 12], [16, 11], [15, 14], [18, 13], [17, 15], [19, 12]].forEach(([x, y]) => { map[y][x] = TILE.HOUSE; });
  for (let x = 12; x < 24; x++) { map[13][x] = TILE.PATH; }
  return map;
}

function createResourceNodes() {
  return [
    { id: 'wood_1', type: 'wood', x: 3, y: 5, amount: 140, maxAmount: 140 },
    { id: 'wood_2', type: 'wood', x: 6, y: 12, amount: 120, maxAmount: 120 },
    { id: 'wood_3', type: 'wood', x: 4, y: 20, amount: 120, maxAmount: 120 },
    { id: 'wood_4', type: 'wood', x: MAP_W - 4, y: 6, amount: 140, maxAmount: 140 },
    { id: 'food_1', type: 'food', x: 22, y: 6, amount: 140, maxAmount: 140 },
    { id: 'food_2', type: 'food', x: 24, y: 18, amount: 120, maxAmount: 120 },
    { id: 'food_3', type: 'food', x: 21, y: 22, amount: 120, maxAmount: 120 },
    { id: 'food_4', type: 'food', x: MAP_W - 6, y: 20, amount: 140, maxAmount: 140 },
  ];
}

function createBuildings() {
  return [
    { id: 'house_1', type: 'house', x: 14, y: 12, capacity: 6, residents: 0, level: 1 },
    { id: 'house_2', type: 'house', x: 16, y: 11, capacity: 6, residents: 0, level: 1 },
    { id: 'house_3', type: 'house', x: 15, y: 14, capacity: 6, residents: 0, level: 1 },
    { id: 'house_4', type: 'house', x: 18, y: 13, capacity: 6, residents: 0, level: 1 },
    { id: 'house_5', type: 'house', x: 17, y: 15, capacity: 6, residents: 0, level: 1 },
    { id: 'house_6', type: 'house', x: 19, y: 12, capacity: 6, residents: 0, level: 1 },
  ];
}

function createWorld() {
  const evolution = new SocietyEvolution();
  const w = {
    version: 7, day: 1, hour: 6, minute: 0, weather: 'clear',
    map: createMap(), resources: createResourceNodes(), buildings: createBuildings(),
    global: { food: 120, wood: 100 }, agents: [], events: [], tick: 0, births: 0, deaths: 0,
    evolution
  };
  evolution.addKnowledge('Foundational Wilderness Foraging', 'gathering', 4, 'Founders', w);
  evolution.addKnowledge('Primitive Log Joinery', 'building', 4, 'Founders', w);
  return w;
}

function formatTime(w) {
  return `Day ${w.day} — ${String(w.hour).padStart(2, '0')}:${String(w.minute).padStart(2, '0')}`;
}

function advanceTime(w, mins) {
  w.minute += mins;
  while (w.minute >= 60) { w.minute -= 60; w.hour += 1; }
  while (w.hour >= 24) {
    w.hour -= 24; w.day += 1;
    const roll = Math.random();
    w.weather = roll < 0.55 ? 'clear' : roll < 0.85 ? 'cloudy' : 'rain';
  }
  w.tick += mins;

  // Resource regeneration scales with global multi-pliers
  if (w.tick % 100 === 0) {
    const regenBonus = Math.floor(w.evolution.globalMultipliers.gathering * 15);
    w.resources.forEach(r => { if (r.amount < r.maxAmount) r.amount = Math.min(r.maxAmount, r.amount + regenBonus); });
  }
}

function isNight(w) { return w.hour < 6 || w.hour >= 20; }
function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
function getTile(w, x, y) { return (y < 0 || y >= MAP_H || x < 0 || x >= MAP_W) ? null : w.map[y][x]; }

function findNearestResource(w, agent, type) {
  let best = null, bestD = Infinity;
  for (const r of w.resources) {
    if (r.type === type && r.amount > 0) {
      const d = dist(agent, r);
      if (d < bestD) { bestD = d; best = r; }
    }
  }
  return best;
}

function findNearestBuilding(w, agent, type) {
  let best = null, bestD = Infinity;
  for (const b of w.buildings) {
    if (b.type === type) {
      const d = dist(agent, b);
      if (d < bestD) { bestD = d; best = b; }
    }
  }
  return best;
}

function logEvent(w, text, important = false, isChat = false, agentIds = []) {
  const entry = { id: `e_${w.tick}_${w.events.length}`, day: w.day, hour: w.hour, minute: w.minute, text, important, isChat, agentIds, tick: w.tick };
  w.events.push(entry);
  if (w.events.length > 1200) w.events = w.events.slice(-900);
  return entry;
}

function totalResourceLeft(w, type) {
  return w.resources.filter(r => r.type === type).reduce((s, r) => s + r.amount, 0);
}

const NAMES = ['Mira', 'Arin', 'Liora', 'Kael', 'Soren', 'Nova', 'Zen', 'Iris', 'Rowan', 'Sage', 'River', 'Sky', 'Stone', 'Echo', 'Ember', 'Ash', 'Fern', 'Dawn', 'Grove', 'Vale', 'Orion', 'Lyra', 'Atlas', 'Vesper', 'Flint', 'Thorne', 'Bram', 'Wren', 'Talon', 'Cyrus'];
const PERSONALITY_TRAITS = ['curious', 'cautious', 'generous', 'ambitious', 'solitary', 'sociable', 'practical', 'dreamy', 'stubborn', 'empathetic'];

function createAgent(id, name, x, y, parentIds = []) {
  const traits = [...PERSONALITY_TRAITS].sort(() => Math.random() - 0.5).slice(0, 2 + Math.floor(Math.random() * 2));
  return {
    id, name, x, y, age: 0, parentIds, alive: true,
    energy: 95 + Math.floor(Math.random() * 5),
    mood: 75 + Math.floor(Math.random() * 20),
    traits, shortTerm: [], relationships: {}, lastSpokenTopic: null,
    inventory: { food: 20, wood: 10 },
    intention: 'explore', currentAction: null, homeId: null,
    skills: { gathering: 25 + Math.random() * 20, building: 20 + Math.random() * 20 },
    foodCached: 0, reproductiveUrge: 5 + Math.random() * 15, partner: null, knowledgeAcquired: [], lastReproduction: -200
  };
}

function createInitialAgents() {
  const starts = [[14, 12], [16, 11], [15, 14], [18, 13], [17, 15], [19, 12]];
  return NAMES.slice(0, 6).map((name, i) => createAgent(`agent_${i + 1}`, name, starts[i][0], starts[i][1]));
}

function addShortMemory(agent, text) {
  agent.shortTerm.unshift(text);
  if (agent.shortTerm.length > 10) agent.shortTerm.pop();
}

function adjustRelationship(agent, otherId, delta, note, tick) {
  if (!agent.relationships[otherId]) agent.relationships[otherId] = { score: 0, notes: [] };
  const rel = agent.relationships[otherId];
  rel.score = Math.max(-100, Math.min(100, rel.score + delta));
  if (note) rel.notes.unshift({ text: note, tick });
}

function getRelScore(agent, otherId) { return agent.relationships[otherId]?.score ?? 0; }

function decide(agent, world) {
  const hungry = agent.energy < 55, veryHungry = agent.energy < 30, tired = agent.energy < 40 && isNight(world);
  const nearby = world.agents.filter(a => a.alive && a.id !== agent.id && dist(agent, a) <= 2);
  
  agent.age += 1;
  // Dynamic reproductive urge scaling to ensure continuous multi-generational growth
  if (agent.age > 20) agent.reproductiveUrge = Math.min(100, agent.reproductiveUrge + 1.5);
  
  if (Math.random() < 0.2 && agent.age % 10 === 0) {
    const learned = world.evolution.learnFromLibrary(agent);
    if (learned) {
      addShortMemory(agent, `Studied library text: ${learned}`);
    }
    const newTech = world.evolution.tryProceduralInvent(agent, world);
    if (newTech) {
      logEvent(world, `⚡ BREAKTHROUGH! ${agent.name} procedurally discovered "${newTech}", advancing society to the ${world.evolution.era}!`, true, false, [agent.id]);
    }
  }
  
  if (veryHungry && agent.inventory.food > 0) return { intention: 'survive', action: 'eat' };
  
  if (hungry || veryHungry) {
    const foodNode = findNearestResource(world, agent, 'food');
    if (foodNode && dist(agent, foodNode) <= 20) {
      if (dist(agent, foodNode) === 0) return { intention: 'gather_food', action: 'gather', target: { id: foodNode.id } };
      return { intention: 'gather_food', action: 'move', target: { x: foodNode.x, y: foodNode.y } };
    }
  }

  // Expanded building construction: allows spreading out workshops and farms across empty land
  if (agent.inventory.wood >= 4 && agent.skills.building >= 20 && Math.random() < 0.35) {
    const buildType = Math.random() < 0.5 ? 'workshop' : 'farm';
    const offsetX = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.floor(Math.random() * 4));
    const offsetY = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.floor(Math.random() * 4));
    const targetX = Math.max(2, Math.min(MAP_W - 3, agent.x + offsetX));
    const targetY = Math.max(2, Math.min(MAP_H - 3, agent.y + offsetY));
    
    if (getTile(world, targetX, targetY) === TILE.GRASS) {
      return { intention: 'build_structure', action: 'construct', target: { type: buildType, x: targetX, y: targetY } };
    }
  }

  if ((isNight(world) && agent.energy < 75) || tired) {
    const house = agent.homeId ? world.buildings.find(b => b.id === agent.homeId) : findNearestBuilding(world, agent, 'house');
    if (house) {
      if (dist(agent, house) === 0) return { intention: 'rest', action: 'rest' };
      return { intention: 'rest', action: 'move', target: { x: house.x, y: house.y } };
    }
  }

  // Allow reproduction if food reserves and housing capacity permit
  const availableHousing = world.buildings.filter(b => b.type === 'house' && b.residents < b.capacity).length;
  if (agent.reproductiveUrge > 45 && !agent.partner && nearby.length > 0 && availableHousing > 0 && world.tick - agent.lastReproduction > 120) {
    const potential = nearby.find(a => getRelScore(agent, a.id) > 2 && !a.partner);
    if (potential) return { intention: 'reproduce', action: 'mate', target: { id: potential.id } };
  }

  if (!agent.homeId) {
    const freeHouse = world.buildings.find(b => b.type === 'house' && b.residents < b.capacity);
    if (freeHouse) {
      if (dist(agent, freeHouse) === 0) return { intention: 'claim_home', action: 'claim_house', target: { id: freeHouse.id } };
      return { intention: 'claim_home', action: 'move', target: { x: freeHouse.x, y: freeHouse.y } };
    }
  }

  if (nearby.length && Math.random() < 0.45) {
    const other = nearby[Math.floor(Math.random() * nearby.length)];
    return { intention: 'socialize', action: 'talk', target: { id: other.id } };
  }

  const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
  const d = dirs[Math.floor(Math.random() * dirs.length)];
  return { intention: 'explore', action: 'move', target: { x: Math.max(0, Math.min(MAP_W - 1, agent.x + d.x)), y: Math.max(0, Math.min(MAP_H - 1, agent.y + d.y)) } };
}

function simulationStep(world, minutesPerStep = 20) {
  advanceTime(world, minutesPerStep);
  const night = isNight(world);

  world.agents.forEach(agent => {
    if (!agent.alive) return;
    let drain = (night ? 0.45 : 0.28) / world.evolution.globalMultipliers.energyEfficiency;
    agent.energy = Math.max(0, agent.energy - drain);
    if (agent.energy <= 0) {
      agent.alive = false;
      world.deaths++;
      logEvent(world, `💀 ${agent.name} has passed away from exhaustion.`, true, false, [agent.id]);
    }
  });

  const activeAgents = world.agents.filter(a => a.alive);
  activeAgents.sort(() => Math.random() - 0.5).forEach(agent => {
    addShortMemory(agent, `At (${agent.x},${agent.y}) - Energy: ${Math.round(agent.energy)}%`);
    executeAction(world, agent, decide(agent, world));
  });
}

function executeAction(world, agent, decision) {
  const { action, target } = decision;
  if (action === 'move') {
    if (!target) return;
    agent.x += Math.sign(target.x - agent.x);
    agent.y += Math.sign(target.y - agent.y);
    agent.energy -= 0.3;
  } else if (action === 'gather') {
    const node = world.resources.find(r => r.id === target.id);
    if (node && node.amount > 0 && dist(agent, node) === 0) {
      const take = Math.min(Math.floor(5 * (agent.skills.gathering / 35) * world.evolution.globalMultipliers.gathering), node.amount);
      node.amount -= take;
      agent.inventory[node.type] += take;
      agent.skills.gathering = Math.min(100, agent.skills.gathering + 0.8);
      
      if (Math.random() < 0.25) {
        const title = node.type === 'food' ? `Advanced Botanical Survey (${agent.name})` : `Optimized Timber Extraction (${agent.name})`;
        world.evolution.addKnowledge(title, node.type === 'food' ? 'gathering' : 'building', 3, agent.name, world);
      }
    }
  } else if (action === 'eat') {
    if (agent.inventory.food > 0) { agent.inventory.food -= 1; agent.energy = Math.min(100, agent.energy + 55); }
  } else if (action === 'rest') {
    agent.energy = Math.min(100, agent.energy + (isNight(world) ? 25 : 15));
  } else if (action === 'construct') {
    if (agent.inventory.wood >= 4) {
      agent.inventory.wood -= 4;
      const tileType = target.type === 'workshop' ? TILE.WORKSHOP : TILE.FARM;
      world.map[target.y][target.x] = tileType;
      world.buildings.push({ id: `${target.type}_${world.buildings.length}`, type: target.type, x: target.x, y: target.y, capacity: 5, residents: 0, level: 1 });
      logEvent(world, `🏗️ ${agent.name} established a new ${target.type} at (${target.x}, ${target.y})!`, true, false, [agent.id]);
      world.evolution.addKnowledge(`Structural Engineering Blueprint for ${target.type}`, 'building', 4, agent.name, world);
    }
  } else if (action === 'talk') {
    const other = world.agents.find(a => a.alive && a.id === target.id);
    if (other && dist(agent, other) <= 2) {
      adjustRelationship(agent, other.id, 6, 'Meaningful conversation', world.tick);
      adjustRelationship(other, agent.id, 6, 'Meaningful conversation', world.tick);
      
      // Contextual dialogue tree: if partner spoke about something specific, reply accordingly
      let spokenLine = '';
      if (other.lastSpokenTopic === 'timber') {
        spokenLine = `"Indeed, let's harvest that timber grove before sunset."`;
      } else if (other.lastSpokenTopic === 'food') {
        spokenLine = `"Agreed, our food caches are vital for the next generation."`;
      } else if (other.lastSpokenTopic === 'weather') {
        spokenLine = `"At least the weather is clear enough to build more workshops."`;
      } else {
        const topics = [
          { key: 'timber', text: `"Do you think we should expand our timber harvesting near the river?"` },
          { key: 'food', text: `"We need to store more food supplies in case winter arrives."` },
          { key: 'weather', text: `"Have you noticed how the weather shifts between seasons?"` },
          { key: 'library', text: `"I read an amazing manuscript in the library yesterday about masonry."` }
        ];
        const chosen = topics[Math.floor(Math.random() * topics.length)];
        agent.lastSpokenTopic = chosen.key;
        spokenLine = chosen.text;
      }

      logEvent(world, `💬 <strong>${agent.name}</strong> to <strong>${other.name}</strong>: ${spokenLine}`, false, true, [agent.id, other.id]);
    }
  } else if (action === 'mate') {
    const other = world.agents.find(a => a.alive && a.id === target.id);
    if (other && dist(agent, other) <= 2) {
      agent.partner = other.id; other.partner = agent.id;
      agent.reproductiveUrge = 0; other.reproductiveUrge = 0;
      agent.lastReproduction = world.tick; other.lastReproduction = world.tick;
      const childName = NAMES.find(n => !world.agents.some(a => a.name === n));
      if (childName && world.agents.filter(a => a.alive).length < 100) {
        const child = createAgent(`agent_${world.agents.length + 1}`, childName, agent.x, agent.y, [agent.id, other.id]);
        world.agents.push(child);
        world.births++;
        logEvent(world, `👶 Population growth! ${agent.name} and ${other.name} welcomed newborn ${childName}.`, true, false, [agent.id, other.id]);
      }
    }
  } else if (action === 'claim_house') {
    const building = world.buildings.find(b => b.id === target.id);
    if (building && building.residents < building.capacity) {
      building.residents += 1; agent.homeId = building.id;
    }
  }
}

let selectedAgentId = null, canvas, ctx, world = null, running = false, speed = 5;

function initUI() {
  canvas = document.getElementById('world-canvas');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  
  document.getElementById('speed-select').addEventListener('change', (e) => { speed = parseInt(e.target.value); });
  document.getElementById('agent-list').onclick = (e) => {
    const card = e.target.closest('.agent-card');
    if (card) { selectedAgentId = card.dataset.id; showAgentDetail(selectedAgentId); }
  };
  document.getElementById('btn-close-detail').onclick = () => {
    selectedAgentId = null;
    document.getElementById('agent-detail').classList.add('hidden');
    document.getElementById('agent-list').style.display = '';
    renderAgentList(world);
  };
  document.getElementById('btn-clear-log').onclick = () => { world.events = []; renderEventLog(world); };
  document.getElementById('btn-hour').onclick = () => { simulationStep(world, 60); renderAll(world); };
  document.getElementById('btn-day').onclick = () => { simulationStep(world, 1440); renderAll(world); };
  
  document.getElementById('btn-run').onclick = () => { 
    running = true; 
    document.getElementById('btn-run').disabled = true; 
    document.getElementById('btn-pause').disabled = false; 
    document.getElementById('summary-modal').classList.remove('active');
  };
  
  document.getElementById('btn-pause').onclick = () => { 
    running = false; 
    document.getElementById('btn-run').disabled = false; 
    document.getElementById('btn-pause').disabled = true; 
    showSummaryModal();
  };

  document.getElementById('btn-close-modal').onclick = () => {
    document.getElementById('summary-modal').classList.remove('active');
  };
  document.getElementById('modal-resume-btn').onclick = () => {
    document.getElementById('summary-modal').classList.remove('active');
    running = true;
    document.getElementById('btn-run').disabled = true;
    document.getElementById('btn-pause').disabled = false;
  };

  document.getElementById('btn-reset').onclick = () => { 
    running = false; 
    world = createWorld(); 
    world.agents = createInitialAgents(); 
    document.getElementById('btn-run').disabled = false; 
    document.getElementById('btn-pause').disabled = true; 
    document.getElementById('summary-modal').classList.remove('active');
    renderAll(world); 
  };
}

function showSummaryModal() {
  const alivePop = world.agents.filter(a => a.alive).length;
  const content = `
    <p><strong>Current Era:</strong> ${world.evolution.era}</p>
    <p><strong>Elapsed Time:</strong> Day ${world.day} (${world.hour}:00)</p>
    <p><strong>Population Status:</strong> ${alivePop} living inhabitants (${world.births} births, ${world.deaths} deaths)</p>
    <p><strong>Total Inventions Discovered:</strong> ${world.evolution.inventions.length}</p>
    <ul>
      ${world.evolution.inventions.map(i => `<li>${i.name} (Discovered by ${i.discoveredBy} on Day ${i.day})</li>`).join('') || '<li>No major inventions yet.</li>'}
    </ul>
    <p style="margin-top:10px;"><strong>Library Archive Manuscripts:</strong> ${world.evolution.entries.length} stored documents.</p>
  `;
  document.getElementById('summary-content').innerHTML = content;
  document.getElementById('summary-modal').classList.add('active');
}

function renderAll(w) {
  renderMap(w); renderStats(w); renderEventLog(w); renderAgentList(w); renderLibrary(w);
  if (selectedAgentId) showAgentDetail(selectedAgentId);
  document.getElementById('time-display').textContent = formatTime(w);
  document.getElementById('era-display').textContent = `Era: ${w.evolution.era}`;
}

function renderStats(w) {
  const aliveCount = w.agents.filter(a => a.alive).length;
  document.getElementById('pop-stat').textContent = `Pop: ${aliveCount} (Births: ${w.births} | Deaths: ${w.deaths})`;
  document.getElementById('food-stat').textContent = `Food: ${totalResourceLeft(w, 'food') + w.global.food}`;
  document.getElementById('wood-stat').textContent = `Wood: ${totalResourceLeft(w, 'wood') + w.global.wood}`;
}

function renderMap(w) {
  const tw = canvas.width / MAP_W, th = canvas.height / MAP_H;
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      ctx.fillStyle = TILE_COLORS[w.map[y][x]] || '#111';
      ctx.fillRect(x * tw, y * th, tw + 0.5, th + 0.5);
    }
  }
  w.buildings.forEach(b => {
    ctx.fillStyle = b.type === 'workshop' ? '#ab47bc' : b.type === 'farm' ? '#26a69a' : '#a1887f';
    ctx.fillRect(b.x * tw + 1, b.y * th + 1, tw - 2, th - 2);
  });
  w.resources.forEach(r => {
    if (r.amount <= 0) return;
    ctx.fillStyle = r.type === 'food' ? '#ff7043' : '#8d6e63';
    ctx.beginPath(); ctx.arc((r.x + 0.5) * tw, (r.y + 0.5) * th, Math.min(tw, th) * 0.3, 0, Math.PI * 2); ctx.fill();
  });
  w.agents.forEach(a => {
    if (!a.alive) return;
    const cx = (a.x + 0.5) * tw, cy = (a.y + 0.5) * th;
    ctx.fillStyle = a.energy < 25 ? '#ef5350' : '#ffee58';
    ctx.beginPath(); ctx.arc(cx, cy, Math.min(tw, th) * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e7ecf3'; ctx.font = `${Math.max(8, tw * 0.5)}px sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(a.name.slice(0, 4), cx, cy - th * 0.45);
  });
}

function renderEventLog(w) {
  document.getElementById('event-log').innerHTML = w.events.slice(-120).reverse().map(e => `
    <div class="event-entry${e.important ? ' important' : ''}${e.isChat ? ' chat' : ''}">
      <span class="event-time">Day ${e.day} — ${String(e.hour).padStart(2,'0')}:${String(e.minute).padStart(2,'0')}</span>
      <span>${e.text}</span>
    </div>
  `).join('');
}

function renderLibrary(w) {
  let html = '';
  w.evolution.inventions.forEach(inv => {
    html += `<div class="tech-entry"><div class="entry-title">💡 Invention: ${inv.name}</div><div class="entry-meta">Discovered by ${inv.discoveredBy} on Day ${inv.day}</div></div>`;
  });
  const topEntries = w.evolution.entries.slice(-8).reverse();
  topEntries.forEach(e => {
    html += `<div class="library-entry"><div class="entry-title">📖 ${e.title}</div><div class="entry-meta">Category: <strong style="color:var(--text);">${e.category}</strong> | Author: ${e.discoveredBy} | Citations: ${e.citations}</div></div>`;
  });
  document.getElementById('library-panel').innerHTML = html || '<div style="color: var(--muted); padding: 8px; font-size: 0.8rem;">Waiting for societal documentation...</div>';
}

function renderAgentList(w) {
  if (selectedAgentId) return;
  const aliveAgents = w.agents.filter(a => a.alive);
  document.getElementById('agent-list').innerHTML = aliveAgents.map(a => `
    <div class="agent-card" data-id="${a.id}">
      <div class="agent-card-name">${a.name}</div>
      <div class="agent-card-meta">${a.traits.join(', ')} · ⚡${Math.round(a.energy)} · 😊${Math.round(a.mood)}</div>
      <div class="agent-card-status">Action: ${a.intention}</div>
    </div>
  `).join('');
}

function showAgentDetail(agentId) {
  const a = world.agents.find(x => x.id === agentId);
  if (!a) return;
  document.getElementById('agent-list').style.display = 'none';
  const detail = document.getElementById('agent-detail');
  detail.classList.remove('hidden');
  
  const parentInfo = a.parentIds && a.parentIds.length > 0 
    ? a.parentIds.map(pid => world.agents.find(ag => ag.id === pid)?.name || 'Ancestor').join(' & ')
    : 'Founder Generation';

  document.getElementById('agent-info').innerHTML = `
    <h3>${a.name}</h3>
    <div class="agent-card-meta">${a.traits.join(' · ')}</div>
    <div style="margin-top:6px;font-size:0.85rem">Location: (${a.x}, ${a.y})</div>
    <div style="font-size:0.85rem">Current Intention: <strong>${a.intention}</strong></div>
    <div style="font-size:0.85rem">Age Ticks: ${a.age} · Lineage: ${parentInfo}</div>
    <div style="font-size:0.85rem">Inventory: Food: ${a.inventory.food}, Wood: ${a.inventory.wood}</div>
    <div class="section">
      <div class="section-title">Skill Proficiencies</div>
      <div style="font-size:0.8rem">
        <div>Gathering Skill: ${Math.round(a.skills.gathering)}%</div>
        <div>Building Skill: ${Math.round(a.skills.building)}%</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Mastered Library Concepts (${a.knowledgeAcquired.length})</div>
      <div style="font-size:0.75rem; color: var(--accent); max-height: 100px; overflow-y: auto;">
        ${a.knowledgeAcquired.length > 0 ? a.knowledgeAcquired.map(k => `• ${k}`).join('<br>') : 'No specialized texts read yet.'}
      </div>
    </div>
    <div class="section">
      <div class="section-title">Energy Level</div>
      <div class="bar"><div class="bar-fill energy" style="width:${Math.max(0, a.energy)}%"></div></div>
    </div>
    <div class="section">
      <div class="section-title">Mood Status</div>
      <div class="bar"><div class="bar-fill mood" style="width:${Math.max(0, a.mood)}%"></div></div>
    </div>
  `;
}

function start() {
  world = createWorld();
  world.agents = createInitialAgents();
  window.world = world;
  initUI();
  renderAll(world);
  loop();
}

function loop() {
  if (running) {
    simulationStep(world, 20);
    renderAll(world);
  }
  setTimeout(loop, Math.max(30, 1000 / speed));
}

document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
